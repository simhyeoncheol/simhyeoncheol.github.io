<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>심현철 | 풀스택 개발자</title>
  <!-- 회사별 지원 링크(/r/회사명) 진입점: 방문을 /r/회사명 경로로 기록한 뒤 메인으로 이동 -->
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};(function(){try{var s=localStorage,m=new URLSearchParams(location.search).get('me');if(m!==null){if(m==='off')s.removeItem('pf-me');else s.setItem('pf-me','1')}if(s.getItem('pf-me')==='1')return}catch(e){}var t=document.createElement('script');t.defer=true;t.src='/_vercel/insights/script.js';document.head.appendChild(t)})();</script>
  <script>
    (function () {
      var company = decodeURIComponent(location.pathname.replace(/^\/r\/?/, '').replace(/\/$/, ''));
      try { if (company) sessionStorage.setItem('ref', company); } catch (e) {}
      setTimeout(function () {
        location.replace('/' + (company ? '?ref=' + encodeURIComponent(company) : ''));
      }, 800);
    })();
  </script>
</head>
<body style="background:#f5f5f2"></body>
</html>
